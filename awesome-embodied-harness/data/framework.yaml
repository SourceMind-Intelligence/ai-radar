- id: quackd
  name: quackd
  date: 2026-08
  summary: >-
    CLI that registers heterogeneous robots through capability manifests and lets an LLM
    (hosted or local) choose one declared skill at a time in a camera-feedback loop, under a
    contract on allowed skills, step budgets and human approval; supports multi-robot
    'flocks'.
  links:
    code: https://github.com/rokbenko/quackd
  access: open
  tags: [tool-use, multi-robot, safety, hitl]
  note: >-
    Very early single-developer project; README reports only one real robot (SO-101 arm)
    tested, other bodies simulated or mocked.
  added: 2026-09-29

- id: abot-agentos
  name: ABot-AgentOS
  title: 'ABot-AgentOS: A General Robotic Agent OS with Lifelong Multi-modal Memory'
  date: 2026-07
  summary: >-
    Robotic agent operating system above low-level controllers providing scene-conditioned
    planning, context-isolated skill execution, multi-stage verification, a persistent
    multimodal graph memory and edge-cloud collaboration; introduces EmbodiedWorldBench.
  links:
    paper: https://arxiv.org/abs/2607.10350
  access: closed
  tags: [agentic-loop, memory, success-detection, benchmark]
  note: >-
    arXiv metadata lists a GitHub repo and project page under amap-cvlab; neither could be
    verified from this sandbox.
  added: 2026-09-29

- id: holoagent-0
  name: HoloAgent-0
  title: 'HoloAgent-0: A Unified Embodied Agent Framework with 3D Spatial Memory'
  date: 2026-06
  org: Horizon Robotics
  summary: >-
    Embodied agent framework whose AgentOS turns instructions into executable skill graphs,
    schedules robot resources, monitors execution and triggers clarification or replanning,
    coordinating heterogeneous robot models around a 3D spatial memory.
  links:
    paper: https://arxiv.org/abs/2606.23565
    code: https://github.com/HorizonRobotics/HoloAgent
    project: https://horizonrobotics.github.io/robot_lab/holoagent
  access: open
  tags: [agentic-loop, memory, 3d, failure-recovery]
  added: 2026-09-29

- id: phyagentos
  name: PhyAgentOS
  title: >-
    PhyAgentOS: A Self-Evolving Operating System for Embodied Agents with Decoupled
    Cognitive Planning and Physical Execution
  date: 2026-03
  org: Sun Yat-sen University (HCP Lab); Peng Cheng Laboratory; X-Era Lab
  summary: >-
    Agent runtime that routes planner tool calls through one versioned gateway to Dora-based
    robot and simulator endpoints, captures before/after evidence, and lets a task-level
    verifier accept, fail or trigger bounded replanning; verified episodes become reusable
    skills.
  links:
    paper: https://arxiv.org/abs/2607.16636
    code: https://github.com/PhyAgentOS/PhyAgentOS-core
    project: https://phy-agent-os.net/
  access: open
  tags: [success-detection, failure-recovery, self-improving, memory, safety]
  note: Code public from 2026-03; technical report posted 2026-07.
  added: 2026-09-29

- id: strands-robots
  name: Strands Robots
  date: 2025-11
  org: Strands Labs (Strands Agents)
  summary: >-
    Gives a Strands agent a Robot() tool backed by MuJoCo/Newton/Isaac simulation or real
    hardware; the agent invokes policies (e.g., GR00T, LeRobot ACT/pi0/SmolVLA) that return
    action chunks, with the same natural-language control in sim and on robots.
  links:
    code: https://github.com/strands-labs/robots
    blog: https://huggingface.co/blog/amazon/strands-lerobot-hub-to-hardware
    docs: https://strandsagents.com/
  access: open
  tags: [vla, tool-use, sim2real, multi-robot]
  added: 2026-09-29

- id: bob-llm
  name: bob_llm
  date: 2025-11
  summary: >-
    ROS 2 node that runs an agentic loop against any OpenAI-compatible LLM endpoint, keeping
    conversation state, loading Python tools dynamically, supporting Agent Skills (SKILL.md)
    discovery and execution, and streaming reasoning tokens to topics.
  links:
    code: https://github.com/bob-ros2/bob_llm
  access: open
  tags: [ros, tool-use, agentic-loop]
  added: 2026-09-29

- id: robocrew
  name: RoboCrew
  date: 2025-10
  summary: >-
    Python library (pip install robocrew) for LLM agents on low-cost robots
    (XLeRobot/LeKiwi, Earth Rover, Unitree Go2): the LLM loops over augmented camera views
    and calls movement tools and VLA policies as tools, with voice I/O and LiDAR mapping.
  links:
    code: https://github.com/Grigorij-Dudnik/RoboCrew
  access: open
  tags: [vla, tool-use, agentic-loop, mobile-manipulation]
  note: Used by the XLeRobot (LeRobot-based) project for LLM agent control.
  added: 2026-09-29

- id: innate-os
  name: Innate OS
  date: 2025-10
  org: Innate
  summary: >-
    Agentic OS for Innate's MARS home robot: Python skills (code, motions or learned
    policies), agents that combine skills, a prompt and input streams in an observe-act loop
