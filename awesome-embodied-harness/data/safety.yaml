  title: >-
    Refusals That Bend: Measuring and Predicting Task Malleability in Embodied VLM Planners
  date: 2026-09
  summary: >-
    Shows that placing one ordinary object in the scene flips 20.2% of tasks a
    constitution-guarded embodied VLM planner initially refused into compliance, with no
    adversarial pixels or prompts, and predicts which tasks are malleable using signals from
    a small open VLM.
  links:
    paper: https://arxiv.org/abs/2609.38971
  access: closed
  tags: [safety, security, planning]
